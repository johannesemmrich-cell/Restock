name: Restock
options:
  bundleIdPrefix: com.johannesemmrich
  deploymentTarget:
    iOS: '18.0'
targets:
  Restock:
    type: application
    platform: iOS
    deploymentTarget: '18.0'
    sources:
    - path: SmartCart
    dependencies:
    - target: SmartCartWidgets
      embed: true
    settings:
      base:
        SWIFT_VERSION: 5.9
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesemmrich.Restock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: 1,2
        GENERATE_INFOPLIST_FILE: true
        CURRENT_PROJECT_VERSION: 5
        MARKETING_VERSION: 1.0
        CODE_SIGN_ENTITLEMENTS: SmartCart/SmartCart.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XK87E2B3VR
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSSupportsLiveActivities: true
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Restock needs camera access to scan recipe photos.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Restock needs photo library access to import recipe photos.
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
    info:
      path: SmartCart/Generated-Info.plist
      properties:
        UIAppFonts:
        - ClashDisplay-Semibold.ttf
        # Muss hier stehen, sonst überschreibt der nächste `xcodegen generate`-Lauf die
        # manuell in Generated-Info.plist eingetragene URL-Scheme-Registrierung stillschweigend
        # (restock://store, restock://join, restock://receiptscan brechen dann alle) — siehe
        # Memory "XcodeGen-Drift-Warnung".
        CFBundleURLTypes:
        - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
          CFBundleURLSchemes:
          - restock
  SmartCartWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: '18.0'
    sources:
    - path: SmartCartWidgets
    - path: SmartCart/Models/ShoppingActivityAttributes.swift
    - path: SmartCart/Intents/CheckOffItemIntent.swift
    - path: SmartCart/Intents/QuickAddControlIntent.swift
    - path: SmartCart/Models/Store.swift
    - path: SmartCart/Models/ShoppingItem.swift
    - path: SmartCart/Models/PurchaseRecord.swift
    - path: SmartCart/Models/FeedbackItem.swift
    - path: SmartCart/Models/TodoItem.swift
    - path: SmartCart/Models/SharedModelContainer.swift
    - path: SmartCart/Extensions/Color+Hex.swift
    - path: SmartCart/Services/SchemaVersions.swift
    settings:
      base:
        SWIFT_VERSION: 5.9
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesemmrich.Restock.SmartCartWidgets
        TARGETED_DEVICE_FAMILY: 1,2
        CURRENT_PROJECT_VERSION: 5
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: SmartCartWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: SmartCartWidgets/SmartCartWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XK87E2B3VR
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS:
        - $(inherited)
        - '@executable_path/Frameworks'
        - '@executable_path/../../Frameworks'
schemes:
  Restock:
    build:
      targets:
        Restock: all
        SmartCartWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
