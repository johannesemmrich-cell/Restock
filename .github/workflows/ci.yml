name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          xcodebuild -list -project Restock.xcodeproj
          xcrun simctl list devices available

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Restock.xcodeproj \
            -scheme Restock \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcpretty
