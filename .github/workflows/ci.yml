name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Always first, always runs, pure shell echo — costs nothing even if every
      # later step fails or gets skipped.
      - name: Regression-Testhinweis
        run: |
          echo "⚠️ Wichtig: CI verhindert Regressionen nur zusammen mit Tests — für neue Features bitte jeweils einen passenden Unit-Test in RestockTests/ ergänzen, sonst greift die CI nicht." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      # NOTE: this project uses XcodeGen (project.yml), but project.yml is known to be
      # stale vs. the checked-in Restock.xcodeproj — it doesn't declare the
      # SmartCartWidgets target, its entitlements, or the shared scheme. Running
      # `xcodegen generate` would silently drop all of that. CI intentionally builds
      # the committed .xcodeproj as-is and does NOT run xcodegen.

      # Reine Dateiprüfungen ohne Xcode (Issue #162): Drift-Test Katalog-JSON ↔ erzeugtes Swift und
      # die Strukturtests aus scripts/, die keinen Arbeitsbaum-Zustand voraussetzen.
      - name: Strukturtests (Python)
        run: |
          python3 -I scripts/build-price-catalog.py --check
          for t in scripts/test_price_catalog_build.py \
                   scripts/test_open_prices_medians.py \
                   scripts/test_ui_tests_discard_community_prices.py \
                   scripts/test_inmemory_containers_no_cloudkit.py \
                   scripts/test_asc_texts.py \
                   scripts/test_asc_scripts.py \
                   scripts/test_asc_check.py; do
            echo "== $t"; python3 -I "$t" || exit 1
          done

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then LATEST="/Applications/Xcode.app"; fi
          echo "Using $LATEST"
          echo "DEVELOPER_DIR=$LATEST/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show environment
        run: |
          xcodebuild -version
          xcodebuild -list -project Restock.xcodeproj

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Pick newest available iPhone simulator
        id: sim
        run: |
          DEVICES=$(xcrun simctl list -j devices available)
          RUNTIME=$(echo "$DEVICES" | jq -r '.devices | keys | map(select(test("iOS"))) | sort | last')
          UDID=$(echo "$DEVICES" | jq -r --arg rt "$RUNTIME" '.devices[$rt] | map(select(.isAvailable and (.name | test("^iPhone")))) | .[0].udid')
          NAME=$(echo "$DEVICES" | jq -r --arg rt "$RUNTIME" '.devices[$rt] | map(select(.isAvailable and (.name | test("^iPhone")))) | .[0].name')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Using $NAME ($UDID) on runtime $RUNTIME"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Restock.xcodeproj \
            -scheme Restock \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -only-testing:RestockTests \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcpretty

      - name: Coverage summary
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            {
              echo "### Code Coverage"
              echo '```'
              xcrun xccov view --report --only-targets TestResults.xcresult
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          retention-days: 7

  # Issue #99, Punkt 5: TestFlight baut Release, die Tests bauen Debug. Dieser Job baut die App
  # bei jedem PR als Release für den Simulator, damit Code, der nur unter DEBUG kompiliert
  # (Launch-Argumente, Fakes), vor dem Upload auffällt. Nur bauen, keine Tests, keine Signatur.
  release-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then LATEST="/Applications/Xcode.app"; fi
          echo "Using $LATEST"
          echo "DEVELOPER_DIR=$LATEST/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Build Release for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Restock.xcodeproj \
            -scheme Restock \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcpretty

  ui-test:
    name: ui-test (${{ matrix.half }})
    runs-on: macos-26
    # Die UI-Suite läuft in zwei Hälften parallel (Issue #136): A führt die schweren Klassen aus
    # HEAVY_CLASSES aus, B den gesamten Rest, auch künftige Klassen. Grund: Start (1,5–5,4 min),
    # Bau und Testzeit (Schwankung Faktor 1,44 bei gleichem Code) brachten den ungeteilten Job
    # über das Limit. Das Limit gilt je Hälfte. Dritter Teil C (Issue #234, D2a): SOLO_CLASSES allein,
    # weil StoreStationsUITests mit 16 Tests (~30 min auf dem Runner) A über 60 min trieb
    # (run 41218440534: 53 Tests grün, Abbruch am Limit); A und B überspringen sie. Danach lag B mit
    # 111 Tests bei 48,5 min Testzeit und brach beim Abschluss ab (run 41223938489), A bei 23 min:
    # ItemRowTapUITests (7,7 min) und QuickAddAssignmentUITests (6,9 min) zogen nach A.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        half: [A, B, C]
    env:
      HEAVY_CLASSES: "ReceiptReviewUITests ShoppingRouteUITests AddItemQuantitySuggestionUITests ReceiptResolutionStatsUITests DynamicTypeUITests ItemRowTapUITests QuickAddAssignmentUITests"
      SOLO_CLASSES: "StoreStationsUITests"
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then LATEST="/Applications/Xcode.app"; fi
          echo "DEVELOPER_DIR=$LATEST/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Pick newest available iPhone simulator
        id: sim
        run: |
          DEVICES=$(xcrun simctl list -j devices available)
          RUNTIME=$(echo "$DEVICES" | jq -r '.devices | keys | map(select(test("iOS"))) | sort | last')
          UDID=$(echo "$DEVICES" | jq -r --arg rt "$RUNTIME" '.devices[$rt] | map(select(.isAvailable and (.name | test("^iPhone")))) | .[0].udid')
          NAME=$(echo "$DEVICES" | jq -r --arg rt "$RUNTIME" '.devices[$rt] | map(select(.isAvailable and (.name | test("^iPhone")))) | .[0].name')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Using $NAME ($UDID) on runtime $RUNTIME"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Explicit boot + bootstatus instead of letting xcodebuild boot implicitly: more
      # reliable, and required so `simctl privacy grant` below has a running device to
      # target before any test tries to trigger a permission prompt.
      - name: Boot simulator
        run: |
          xcrun simctl boot ${{ steps.sim.outputs.udid }}
          xcrun simctl bootstatus ${{ steps.sim.outputs.udid }} -b

      # Grants everything the app can prompt for (camera, photos — see project.pbxproj
      # INFOPLIST_KEY_NS*UsageDescription). The one smoke test in RestockUITests doesn't
      # currently touch either flow, but granting up front means a future receipt-scan/
      # recipe-photo UI test doesn't hang on a system permission alert XCUITest can't
      # reliably dismiss.
      - name: Grant app permissions
        run: |
          xcrun simctl privacy ${{ steps.sim.outputs.udid }} grant camera com.johannesemmrich.Restock
          xcrun simctl privacy ${{ steps.sim.outputs.udid }} grant photos com.johannesemmrich.Restock

      - name: Build and run UI tests
        run: |
          set -o pipefail
          SELECTION=()
          # Issue #145 D2: Der Mitteilungsdialog lässt sich je frischem Simulator genau einmal
          # entscheiden (NotificationPermissionUITests, Gate RESTOCK_NOTIF_DECISION). Hälfte A
          # erlaubt (Klasse zusätzlich gewählt, steht nicht in HEAVY_CLASSES), Hälfte B lehnt ab
          # (Klasse ist Teil von RestockUITests). Ohne die Variable überspringt sich die Klasse.
          if [ "${{ matrix.half }}" = "A" ]; then
            export TEST_RUNNER_RESTOCK_NOTIF_DECISION=allow
            SELECTION+=("-only-testing:RestockUITests/NotificationPermissionUITests")
            for CLASS in $HEAVY_CLASSES; do
              SELECTION+=("-only-testing:RestockUITests/$CLASS")
            done
          elif [ "${{ matrix.half }}" = "C" ]; then
            for CLASS in $SOLO_CLASSES; do
              SELECTION+=("-only-testing:RestockUITests/$CLASS")
            done
          else
            export TEST_RUNNER_RESTOCK_NOTIF_DECISION=deny
            SELECTION+=("-only-testing:RestockUITests")
            for CLASS in $HEAVY_CLASSES $SOLO_CLASSES; do
              SELECTION+=("-skip-testing:RestockUITests/$CLASS")
            done
          fi
          echo "Hälfte ${{ matrix.half }}: ${SELECTION[*]}"
          # Issue #173, Fassung 2 (2026-10-21): Ein fehlgeschlagener UI-Test läuft im selben Lauf genau
          # einmal erneut, und zwar NUR er. Die erste Fassung (-retry-tests-on-failure -test-iterations 2
          # -test-repetition-relaunch-enabled YES) wiederholte nach einem Fehlschlag die gesamte Auswahl
          # (belegt im Lauf 39563379941: beide Hälften liefen den vollen Satz zweimal und brachen am
          # Limit von 60 min ab). Jetzt: erster Lauf wie bisher; ist er rot, liest ci_failed_ui_tests.py
          # die fehlgeschlagenen Testfälle aus dem Ergebnisbündel, und test-without-building startet
          # genau diese (App-Neustart je Test ist bei XCUITest ohnehin der Fall). Grün bei grüner
          # Wiederholung. Kein Test wird übersprungen; Rot ohne fehlgeschlagenen Testfall (Bau,
          # Simulator, Abbruch) bleibt ohne Wiederholung rot.
          run_ui_tests() {
            local action="$1" bundle="$2"
            shift 2
            xcodebuild "$action" \
              -project Restock.xcodeproj \
              -scheme Restock \
              -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
              "$@" \
              -resultBundlePath "$bundle" \
              -skipMacroValidation \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=YES \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              | xcpretty
          }
          set +e
          run_ui_tests test UITestResults.xcresult "${SELECTION[@]}"
          FIRST_STATUS=$?
          set -e
          if [ "$FIRST_STATUS" -eq 0 ]; then
            exit 0
          fi
          FAILED=$(xcrun xcresulttool get test-results tests --path UITestResults.xcresult --compact 2>/dev/null \
            | python3 scripts/ci_failed_ui_tests.py)
          if [ -z "$FAILED" ]; then
            echo "Erster Lauf rot (Status $FIRST_STATUS) ohne fehlgeschlagenen Testfall: keine Wiederholung."
            exit "$FIRST_STATUS"
          fi
          RETRY=()
          for TEST in $FAILED; do
            RETRY+=("-only-testing:RestockUITests/$TEST")
          done
          echo "Wiederholung genau einmal (Issue #173): ${RETRY[*]}"
          run_ui_tests test-without-building UITestRetry.xcresult "${RETRY[@]}"

      - name: Test summary (incl. retries)
        if: always()
        run: |
          # Issue #173: xcresulttool-Zusammenfassung in die Lauf-Zusammenfassung, damit Tests, die
          # erst in der Wiederholung grün wurden, nicht unbemerkt bleiben. Nie fehlschlagen lassen.
          {
            echo "### UI-Tests Hälfte ${{ matrix.half }}: xcresult-Zusammenfassung (erster Lauf)"
            echo '```json'
            xcrun xcresulttool get test-results summary --path UITestResults.xcresult --compact 2>/dev/null \
              || echo '{"error": "xcresulttool summary nicht lesbar"}'
            echo '```'
            if [ -d UITestRetry.xcresult ]; then
              echo "### UI-Tests Hälfte ${{ matrix.half }}: Wiederholung nur der fehlgeschlagenen Tests"
              echo '```json'
              xcrun xcresulttool get test-results summary --path UITestRetry.xcresult --compact 2>/dev/null \
                || echo '{"error": "xcresulttool summary nicht lesbar"}'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UITestResults-${{ matrix.half }}.xcresult
          path: |
            UITestResults.xcresult
            UITestRetry.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Issue #99, Punkt 1 (Paket 4, PO 2026-10-21): Der Weg Fotos-App → Teilen → Restock läuft bei
  # jedem PR, blockierend. Die Oberfläche der Erweiterung ist für XCUITest unerreichbar (eigener
  # Prozess); das Urteil fällt scripts/run-share-extension-uitest.sh von außen: Nutzlast in der
  # App-Gruppe, Positionen und Endsumme, keine neuen Absturzberichte. Das echte Bon-Bild bleibt
  # außerhalb des Repos (Datenschutz); hier dient das erzeugte Lidl-Plus-Bild aus
  # scripts/make-test-receipt-image.swift (gleiche Zeilen wie GeneratedReceipt in
  # ReceiptTextRecognizerTests: 18 Positionen, Endsumme 68,69).
  share-extension:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then LATEST="/Applications/Xcode.app"; fi
          echo "DEVELOPER_DIR=$LATEST/Contents/Developer" >> "$GITHUB_ENV"

      - name: Pick newest available iPhone simulator
        id: sim
        run: |
          DEVICES=$(xcrun simctl list -j devices available)
          RUNTIME=$(echo "$DEVICES" | jq -r '.devices | keys | map(select(test("iOS"))) | sort | last')
          UDID=$(echo "$DEVICES" | jq -r --arg rt "$RUNTIME" '.devices[$rt] | map(select(.isAvailable and (.name | test("^iPhone")))) | .[0].udid')
          NAME=$(echo "$DEVICES" | jq -r --arg rt "$RUNTIME" '.devices[$rt] | map(select(.isAvailable and (.name | test("^iPhone")))) | .[0].name')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Using $NAME ($UDID) on runtime $RUNTIME"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: |
          xcrun simctl boot ${{ steps.sim.outputs.udid }}
          xcrun simctl bootstatus ${{ steps.sim.outputs.udid }} -b

      - name: Grant app permissions
        run: |
          xcrun simctl privacy ${{ steps.sim.outputs.udid }} grant camera com.johannesemmrich.Restock
          xcrun simctl privacy ${{ steps.sim.outputs.udid }} grant photos com.johannesemmrich.Restock

      - name: Generate test receipt image
        run: |
          swift scripts/make-test-receipt-image.swift "$RUNNER_TEMP/testbon.png"
          ls -la "$RUNNER_TEMP/testbon.png"

      - name: Photos → Share → Restock
        run: |
          set -o pipefail
          TEST_IMAGE="$RUNNER_TEMP/testbon.png" \
          MIN_POSITIONS=18 \
          EXPECT_TOTAL=68,69 \
          RESTOCK_XCODEBUILD_FLAGS="-skipMacroValidation CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES AD_HOC_CODE_SIGNING_ALLOWED=YES" \
          RESTOCK_SHARE_DIAG_DIR="$RUNNER_TEMP/share-diag" \
          bash scripts/run-share-extension-uitest.sh ${{ steps.sim.outputs.udid }} | tee share-extension.log

      - name: Result block to job summary
        if: always()
        run: |
          {
            echo "### Teilen-Erweiterung: Ergebnisblock"
            echo '```'
            sed -n '/=== ERGEBNIS ===/,$p' share-extension.log 2>/dev/null || echo "kein Ergebnisblock (Lauf vorzeitig beendet)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log and diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: share-extension-diagnose
          path: |
            share-extension.log
            ${{ runner.temp }}/share-diag
            ${{ runner.temp }}/testbon.png
          if-no-files-found: ignore
          retention-days: 7
